# Fig. 8 sweep: discount factor rho = 0.05..0.95, at both sigma_u regimes.
# Regression-test invariant (paper section 6): at sigma_u = 100 the results
# should be nearly flat in rho (over-pruning mechanism does not rely on
# dynamic punishment threats).
# 20 cells (row-major over rho x sigma_u) x 100 tasks = Nsim 1000 sessions/cell.
params:
  I: 2
  vbar: 1.0
  sigma_v: 1.0
  xi: 500.0
  theta: 0.1
  alpha: 0.01
  beta: 5.0e-7
  iota: 0.1
  nv: 10
  nx: 15
  np: 31
  Tm: 10000

sweep:
  rho: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]
  sigma_u: [0.1, 100.0]

run:
  batch: 10
  max_periods: 0
  conv_streak: 1000000
  eval_periods: 100000
  chunk_size: 20000
  freeze_on_convergence: true
  mm_init: nash
